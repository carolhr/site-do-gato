<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Divertida do Gato</title>
  <!-- Esta é uma página HTML divertida com estilo e animação -->

  <!-- Versão 100% corrigida com o endereço completo do SVG 🐱 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">

  <!-- Link para o arquivo de estilos CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Olá, Mundo Divertido! 🎉</h1>
  <p>Este é um mini código com estilo e animação.</p>
  
  <!-- O evento de clique foi movido para o arquivo script.js -->
  <button id="botaoClique">Clique em Mim</button>

  <!-- Elementos que vão aparecer instantaneamente -->
  <p id="textoSucesso" class="mensagem-sucesso">Você clicou no botão! 🚀 O gato apareceu!</p>
  <img id="fotoGato" src="https://static.vecteezy.com/ti/vetor-gratis/t2/23426285-branco-gato-kawaii-acenando-patas-mao-fofa-branco-bichano-gato-desenho-animado-vetor.jpg" alt="Gato Fofo">

    <!-- Nova Seção de Curiosidades -->
  <div class="secao-curiosidades">
    <button id="botaoCuriosidade">Me conte uma curiosidade! 🐱</button>
    <p id="textoCuriosidade"></p>
  </div>

  <!-- Áudio público de miado de gato -->
  <!-- Novo link de áudio em formato MP3 direto do GitHub -->
<audio id="somMiado" src="https://githubusercontent.com"></audio>


  <!-- Link para o arquivo de funções JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
