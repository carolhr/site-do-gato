<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Divertida do Gato</title>
  <!-- Esta é uma página HTML divertida com estilo e animação -->

  <!-- Versão 100% corrigida com o endereço completo do SVG 🐱 -->
  <link rel="icon" type="image/png" href="cara-gato.png">

  <!-- Link para o arquivo de estilos CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Olá, Mundo Divertido! 🎉</h1>
  <p>Este é um mini código com estilo e animação.</p>
  
  <!-- O evento de clique foi movido para o arquivo script.js -->
  <button id="botaoClique">Clique em Mim</button>

  <!-- Elementos que vão aparecer instantaneamente -->
  <p id="textoSucesso" class="mensagem-sucesso">Você clicou no botão! 🚀 O gato apareceu!</p>
  <img id="fotoGato" src="https://static.vecteezy.com/ti/vetor-gratis/t2/23426285-branco-gato-kawaii-acenando-patas-mao-fofa-branco-bichano-gato-desenho-animado-vetor.jpg" alt="Gato Fofo">

    <!-- Nova Seção de Curiosidades -->
  <div class="secao-curiosidades">
    <button id="botaoCuriosidade">Me conte uma curiosidade! 🐱</button>
    <p id="textoCuriosidade"></p>
  </div>

    <!-- Seção de RH e Administração Felina -->
  <div class="secao-curiosidades" style="border-top: 1px dashed #ff79c6; margin-top: 30px;">
    <h2 style="color: #8be9fd;">💼 RH Felino: Contrate um Executivo</h2>
    <button id="botaoContratar" style="background-color: #8be9fd; color: #282a36;">Gerar Contrato de Trabalho 📝</button>
    <div id="fichaContrato" style="margin-top: 20px; display: none; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; color: #f8f8f2;">
      <p><strong>Cargo:</strong> <span id="contratoCargo" style="color: #ff79c6;"></span></p>
      <p><strong>Departamento:</strong> <span id="contratoDepto"></span></p>
      <p><strong>Salário Base:</strong> <span id="contratoSalario" style="color: #50fa7b;"></span></p>
      <p><strong>Bônus (PLR):</strong> <span id="contratoPlr"></span></p>
      <p><strong>Meta de Indicador (KPI):</strong> <span id="contratoMeta" style="color: #f1fa8c;"></span></p>
    </div>
  </div>


  <!-- Áudio público de miado de gato -->
  <!-- Novo link de áudio em formato MP3 direto do GitHub -->
<audio id="somMiado" src="Gatinho_miando.mp3"></audio>


  <!-- Link para o arquivo de funções JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
